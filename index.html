<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在进入安全下载通道...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .box { background: #1e293b; padding: 30px 20px; border-radius: 16px; max-width: 400px; width: 100%; border: 1px solid #334155; }
        .loader { border: 4px solid #334155; border-top: 4px solid #38bdf8; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 18px; color: #38bdf8; margin-bottom: 10px; }
        p { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; }
        .btn { display: block; background: #0284c7; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        .btn-sub { background: #475569; font-size: 13px; }
        /* 微信/QQ内置浏览器遮罩层 */
        #wechat-tip { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; padding-top: 60px; color: #fff; }
        #wechat-tip p { font-size: 18px; line-height: 1.8; padding: 0 20px; }
    </style>
</head>
<body>

    <!-- 微信/QQ拦截提示遮罩 -->
    <div id="wechat-tip">
        <p>↗️ 请点击右上角 <b>···</b> 按钮<br>选择 <b>“在默认浏览器中打开”</b><br>即可自动开始下载</p>
    </div>

    <!-- 正常跳转加载界面 -->
    <div class="box">
        <div class="loader"></div>
        <h2>正在为您分配高速下载节点...</h2>
        <p>页面即将在 2 秒内自动跳转，如未自动跳转请点击下方按钮：</p>
        
        <!-- 替换下方的推广域名 -->
        <a id="main-link" href="https://axjsq05.cc" class="btn">🚀 点击立即下载（主线路）</a>
        <a href="https://axjsq05.cc" class="btn btn-sub">🛡️ 备用下载通道</a>
    </div>

    <script>
        // 1. 设置你的主推广域名
        var targetUrl = "https://axjsq05.cc";

        // 2. 检测是否在微信或QQ内置浏览器中打开
        var ua = navigator.userAgent.toLowerCase();
        var isWechatOrQQ = ua.indexOf('micromessenger') !== -1 || ua.indexOf('qq/') !== -1;

        if (isWechatOrQQ) {
            // 如果是微信/QQ，显示右上角引导遮罩，不执行自动跳转以免被拦截报错
            document.getElementById('wechat-tip').style.display = 'block';
        } else {
            // 如果是正常浏览器，1.5秒后自动无感跳转至你的推广域名
            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 1500);
        }
    </script>
</body>
</html>
